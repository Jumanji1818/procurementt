name: Build Procura Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor and add Android
        run: |
          npx cap init "Procura" "com.procura.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            find android -type f -name "*.apk" || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          echo "path=
